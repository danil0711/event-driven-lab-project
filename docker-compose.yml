version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: ed-lab-project-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d
    networks:
      - app


  # ---------------------
  # KAFKA
  # ---------------------

  kafka-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ed-lab-project-kafka-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ed-lab-project-kafka-broker
    depends_on:
      - kafka-zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: kafka-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ed-lab-project-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: kafka-zookeeper:2181
    depends_on:
      - kafka-broker
      - kafka-zookeeper
    networks:
      - app

  # ---------------------
  # 
  # МИКРОСЕРВИС ORDERS
  # 
  # ---------------------
  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    labels:
      service: orders
    env_file:
      - ./services/order-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    ports:
      - "8000:8000"
    networks:
      - app

  order-outbox-worker:
    build:
      context: ./services/order-service
    container_name: order-outbox-worker
    labels:
      service: orders
    command: python outbox_worker.py
    env_file:
      - ./services/order-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app
    restart: unless-stopped


  order-inventory-saga-worker:
    build:
      context: ./services/order-service
    container_name: order-inventory-saga-worker
    labels:
      service: orders
    command: python inventory_saga_worker.py
    env_file:
      - ./services/order-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app
    restart: unless-stopped


  order-payment-saga-worker:
    build:
      context: ./services/order-service
    container_name: order-payment-saga-worker
    labels:
      service: orders
    command: python payments_saga_worker.py
    env_file:
      - ./services/order-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app
    restart: unless-stopped


  # ---------------------
  # 
  # МИКРОСЕРВИС PAYMENTS
  # 
  # ---------------------
  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    labels:
      service: payments
    command: python main.py

    env_file:
      - ./services/payment-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  payment-outbox-worker:
    build:
      context: ./services/payment-service
    container_name: payment-outbox-worker
    labels:
      service: payments
    command: python outbox_worker.py
    env_file:
      - ./services/payment-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app
    restart: unless-stopped


  # ---------------------
  # 
  # МИКРОСЕРВИС INVENTORY
  # 
  # ---------------------

  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: inventory-service
    labels:
      service: inventory
    command: python main.py

    env_file:
      - ./services/inventory-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  inventory-outbox-worker:
    build:
      context: ./services/inventory-service
    container_name: inventory-outbox-worker
    labels:
      service: inventory
    command: python outbox_worker.py
    env_file:
      - ./services/inventory-service/.env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app
    restart: unless-stopped


  # ---------------------
  # PROMETHEUS
  # ---------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: ed-lab-project-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - observability

  # ---------------------
  # GRAFANA
  # ---------------------

  grafana:
    image: grafana/grafana:latest
    container_name: ed-lab-project-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - observability

  # ---------------------
  # LOKI
  # ---------------------

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability

  # ---------------------
  # PROMTAIL
  # ---------------------

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail.yml:/etc/promtail/config.yml
    command:
      - -config.file=/etc/promtail/config.yml
    networks:
      - observability

volumes:
  postgres_data:
  grafana_data:

networks:
  app:
  observability:
